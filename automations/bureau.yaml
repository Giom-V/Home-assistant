# Automations related to my office.
#
# There are 2 automations:
# * `Press office button (switch on/off screens)`: Toggles my screens on/off
#   when I press the button on my desk.
# * `Office window opened while it rains`: Sends me a notification if the
#   office window is open while it's raining.

- id: "office_button_toggle_screens"
  alias: Press office button (switch on/off screens)
  description: "Bascule l'alimentation des écrans en appuyant sur le bouton du bureau"
  triggers:
    - trigger: mqtt
      topic: "zigbee2mqtt/Office button/action"
      payload: "single"
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: switch.multiprise_bureau_l1
                  state: "on"
                - condition: state
                  entity_id: switch.multiprise_bureau_l2
                  state: "on"
          sequence:
            - service: switch.turn_off
              target:
                entity_id:
                  - switch.multiprise_bureau_l1
                  - switch.multiprise_bureau_l2
      default:
        - service: switch.turn_on
          target:
            entity_id:
              - switch.multiprise_bureau_l1
              - switch.multiprise_bureau_l2
  mode: single

- id: "office_window_rain_notification"
  alias: Office window opened while it rains
  description: "M'envoie une notification si la fenêtre du bureau est ouverte alors qu'il pleut."
  triggers:
    - platform: numeric_state
      entity_id: sensor.pluviometre_netatmo_rain
      above: 0.1
  conditions:
    - condition: state
      entity_id: binary_sensor.velux_bureau_contact
      state: "on"
  actions:
    - service: notify.mobile_app_pixel_8_pro
      data:
        title: "🌧️ Pluie dans le bureau"
        message: "Le velux est ouvert alors qu'il pleut 😱"
  mode: single
