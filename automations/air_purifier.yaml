# Those automations are related to my air purifier located in my office. That's
# the reason why their are all using the `input_boolean.working` value that
# indicates if I'm working in my office or not. That value is managed in
# [`working.yaml`](#working), documented below.
#
# There are 4 automations:
# * `Turn on Air Purifier when I start working`: As its name implies starts the
#   air purifier when I start working.
# * `Turn off Air Purifier when I'm off`: Turns it off when I leave the office.
# * `Turn off Air purifier when I stop working`: Turns it off when I stop working.
# * `Turn off Air purifier for a while if the air quality is good`: In case the
#   air quality is good enough (PM2.5 under 2 for 5mn), I then turn off the air
#   purifier for 30mn. This is meant to save energy and extend filter life.

- id: "1667896446367"
  alias: Turn off Air purifier for a while if the air quality is good
  description: "Éteint le purificateur d'air si la qualité de l'air est bonne"
  trigger:
    - platform: numeric_state
      entity_id: sensor.zhimi_airpurifier_mb4_pm2_5
      below: 2
      for:
        hours: 0
        minutes: 5
        seconds: 0
  condition:
    - condition: state
      entity_id: fan.unnamed_device
      state: "on"
  action:
    - service: fan.turn_off
      target:
        entity_id: fan.unnamed_device
    - delay:
        hours: 0
        minutes: 30
        seconds: 0
        milliseconds: 0
    - if:
        - condition: state
          entity_id: input_boolean.working
          state: "on"
      then:
        - service: fan.turn_on
          target:
            entity_id: fan.unnamed_device
  mode: single

- id: "1669377084491"
  alias: Turn off Air Purifier when I'm off
  description: "Éteint le purificateur d'air quand je ne suis plus au bureau"
  trigger:
    - platform: state
      entity_id:
        - person.guillaume
      to: not_home
  condition:
    - condition: state
      entity_id: fan.unnamed_device
      state: "on"
  action:
    - service: fan.turn_off
      target:
        entity_id: fan.unnamed_device
  mode: single

- id: "1669377272682"
  alias: Turn on Air Purifier when I start working
  description: "Allume le purificateur d'air quand je commence à travailler"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.working
      to: "on"
  condition:
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.rte_tempo_couleur_actuelle_visuel
          state: rouge
  action:
    - service: fan.turn_on
      target:
        entity_id: fan.unnamed_device
  mode: single

- id: "1669378742486"
  alias: Turn off Air purifier when I stop working
  description: "Éteint le purificateur d'air quand je finis de travailler"
  trigger:
    - platform: state
      entity_id:
        - input_boolean.working
      to: "off"
  condition: []
  action:
    - service: fan.turn_off
      target:
        entity_id: fan.unnamed_device
  mode: single
