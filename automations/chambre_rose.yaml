- id: "1736756974252"
  alias: "Bedroom remote: LEDs"
  description: "Controle les LEDs de la chambre avec la télécommande"
  triggers:
    - domain: mqtt
      device_id: a7995daf6b00103a726e7417cf4e5b9b
      type: action
      subtype: arm_all_zones
      metadata: {}
      trigger: device
  conditions: []
  actions:
    - type: toggle
      device_id: 80fbbf7d7f0606c4dc0731332c33e4c0
      entity_id: 9d794747df6e33f51d6a02d194d88d70
      domain: light
  mode: single
- id: "1736757260832"
  alias: "Bedroom remote: covers "
  description: "Télécommande de la chambre : volets"
  triggers:
    - domain: mqtt
      device_id: a7995daf6b00103a726e7417cf4e5b9b
      type: action
      subtype: arm_day_zones
      trigger: device
  conditions: []
  actions:
    - if: []
      then:
        - device_id: 22b77f8ecce501db1f53c1b19a852202
          domain: cover
          entity_id: 3c329cfad3629946c940a2f6999b69ab
          type: open
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: device
                  device_id: 22b77f8ecce501db1f53c1b19a852202
                  domain: cover
                  entity_id: 3c329cfad3629946c940a2f6999b69ab
                  type: is_closing
                - condition: device
                  device_id: 22b77f8ecce501db1f53c1b19a852202
                  domain: cover
                  entity_id: 3c329cfad3629946c940a2f6999b69ab
                  type: is_opening
          sequence:
            - device_id: 22b77f8ecce501db1f53c1b19a852202
              domain: cover
              entity_id: 3c329cfad3629946c940a2f6999b69ab
              type: stop
        - conditions:
            - condition: device
              device_id: 22b77f8ecce501db1f53c1b19a852202
              domain: cover
              entity_id: 3c329cfad3629946c940a2f6999b69ab
              type: is_open
          sequence:
            - device_id: 22b77f8ecce501db1f53c1b19a852202
              domain: cover
              entity_id: 3c329cfad3629946c940a2f6999b69ab
              type: close
      default:
        - device_id: 22b77f8ecce501db1f53c1b19a852202
          domain: cover
          entity_id: 3c329cfad3629946c940a2f6999b69ab
          type: open
  mode: single
- id: penderie_schedule_on
  alias: "Penderie - Activation selon planning"
  description: "Active la lumière de la penderie lorsque le planning s'active (9h en semaine, 12h le week-end/vacances)"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.penderie_schedule_active
      to: "on"
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: binary_sensor.penderie_schedule_active
      state: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.lumiere_penderie

- id: penderie_schedule_off
  alias: "Penderie - Extinction selon planning"
  description: "Éteint la lumière de la penderie lorsque le planning se désactive (22h en semaine, 23h le week-end/vacances)"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.penderie_schedule_active
      to: "off"
    - platform: homeassistant
      event: start
  condition:
    - condition: state
      entity_id: binary_sensor.penderie_schedule_active
      state: "off"
  action:
    - service: light.turn_off
      target:
        entity_id: light.lumiere_penderie

- id: "1736757407681"
  alias: "Bedroom remote: wardrobe"
  description: "Télécommande de la chambre : armoire"
  triggers:
    - domain: mqtt
      device_id: a7995daf6b00103a726e7417cf4e5b9b
      type: action
      subtype: disarm
      trigger: device
  conditions: []
  actions:
    - service: light.toggle
      target:
        entity_id: light.lumiere_penderie
  mode: single
