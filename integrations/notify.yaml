notify:
  - platform: slack
    name: Slack
    api_key: !secret slack_APIKey
    default_channel: "#hass"
  - name: SMS
    platform: free_mobile
    username: !secret freeMobileUsername
    access_token: !secret freeMobileToken
  - name: log_nouvelles_entites
    platform: file
    filename: /config/nouvelles_entites.log
    timestamp: true # Cela ajoutera automatiquement la date et l'heure devant chaque ligne
